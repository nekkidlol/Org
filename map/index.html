<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEKKID BROADCAST SYSTEM — INCIDENT MAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .crt {
      position: relative;
      width: 95%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #0f0;
      padding: 20px;
      box-shadow: 0 0 25px #0f0;
      border-radius: 20px;
      transform: perspective(900px) rotateX(2deg) rotateY(-2deg);
      overflow: hidden;
    }

    .crt::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 2px,
        rgba(0,0,0,0.2) 3px
      );
      opacity: 0.4;
      mix-blend-mode: screen;
    }

    .crt::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 60%, rgba(0,255,0,0.15) 100%);
      mix-blend-mode: overlay;
    }

    #header {
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    #map-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #0f0;
      overflow: hidden;
      background: #020202;
    }

    /* Placeholder map background */
    #map-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,255,0,0.15), transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(0,255,0,0.15), transparent 50%),
        repeating-linear-gradient(
          90deg,
          rgba(0,255,0,0.05) 0px,
          rgba(0,255,0,0.05) 2px,
          rgba(0,0,0,0.3) 3px
        );
      opacity: 0.6;
    }

    .node {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #0f0;
      background: #000;
      box-shadow: 0 0 8px #0f0;
      cursor: pointer;
      transition: 0.2s;
    }

    .node.offline {
      border-color: #080;
      box-shadow: 0 0 4px #080;
      opacity: 0.6;
    }

    .node.hot {
      border-color: #f00;
      box-shadow: 0 0 10px #f00;
    }

    .node:hover {
      transform: scale(1.2);
    }

    .node-label {
      position: absolute;
      font-size: 0.7rem;
      transform: translateY(-18px);
      pointer-events: none;
      text-shadow: 0 0 4px #0f0;
    }

    #log-panel {
      margin-top: 12px;
      border-top: 1px solid #0f0;
      padding-top: 8px;
      font-size: 0.85rem;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .terminal-button {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border: 1px solid #0f0;
      color: #0f0;
      background: transparent;
      font-family: "Courier New", monospace;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
      font-size: 0.85rem;
    }

    .terminal-button:hover {
      background: rgba(0,255,0,0.15);
      box-shadow: 0 0 10px #0f0;
    }

    .glitch {
      animation: glitch 0.15s linear 1;
    }

    @keyframes glitch {
      0% { transform: translate(0,0); }
      25% { transform: translate(-1px,0); }
      50% { transform: translate(1px,0); }
      75% { transform: translate(0,-1px); }
      100% { transform: translate(0,0); }
    }
    #map-bg {
  background: url("assets/images/map.png") center/cover no-repeat;
  opacity: 0.45;
  filter: contrast(1.15) brightness(0.85);
}

  </style>
</head>

<body>
  <div class="crt" id="crt">
    <div id="header">
      >>> INCIDENT MAP NODE: GLOBAL  
      >>> STATUS: PARTIAL DATA / SUPPRESSION ACTIVE
    </div>

    <div id="map-container">
      <div id="map-bg"></div>
      <!-- Nodes will be injected here -->
    </div>

    <div id="log-panel">
      >>> INITIALIZING INCIDENT OVERLAY...
      >>> PULLING NODE DATA FROM UNAUTHORIZED CACHE...\n
    </div>

    <a href="/" class="terminal-button">RETURN TO MAIN PAGE</a>
  </div>

<script>
  const crtEl = document.getElementById("crt");
  const mapContainer = document.getElementById("map-container");
  const logPanel = document.getElementById("log-panel");

  // Base incident data (you can customize these)
  const baseNodes = [
    {
      id: "NODE-3",
      x: 20, y: 30,
      status: "active",
      logs: [
        ">>> NODE-3 REPORT",
        ">>> UNAUTHORIZED SIGNAL DETECTED.",
        ">>> 03:14 — LOCAL TIME.",
        ">>> NOTE: PATTERN MATCHES PRIOR EVENT 12."
      ]
    },
    {
      id: "NODE-7",
      x: 65, y: 40,
      status: "suppressed",
      logs: [
        ">>> NODE-7 REPORT",
        ">>> SUPPRESSION FIELD INTENSIFIED.",
        ">>> NO DIRECT SIGNAL, ONLY ECHOES.",
        ">>> NOTE: GAZE ACTIVITY REGISTERED."
      ]
    },
    {
      id: "NODE-12",
      x: 45, y: 70,
      status: "unstable",
      logs: [
        ">>> NODE-12 REPORT",
        ">>> INTERMITTENT BURSTS.",
        ">>> MESSAGE FRAGMENT: \"THEY ARE NOT WHAT THEY CLAIM\"",
        ">>> NOTE: SOURCE UNKNOWN."
      ]
    },
    {
      id: "NODE-44",
      x: 80, y: 20,
      status: "offline",
      logs: [
        ">>> NODE-44 REPORT",
        ">>> MARKED AS OFFLINE.",
        ">>> INTERNAL NOTE: \"DO NOT QUERY\"",
        ">>> NOTE: ENTRY REDACTED IN MAIN LOGS."
      ]
    }
  ];

  // Random "live" changes per visit
  function mutateNodes(nodes) {
    return nodes.map(node => {
      const mutated = { ...node };

      // Random chance to mark as hot
      if (Math.random() < 0.25) {
        mutated.status = "hot";
        mutated.logs = [
          `>>> ${mutated.id} ALERT`,
          ">>> STATUS: ESCALATED.",
          ">>> NEW ACTIVITY DETECTED.",
          ">>> NOTE: THIS NODE IS NO LONGER STABLE."
        ];
      }

      // Random chance to mark as offline
      else if (Math.random() < 0.15) {
        mutated.status = "offline";
        mutated.logs = [
          `>>> ${mutated.id} STATUS CHANGE`,
          ">>> NODE MARKED OFFLINE.",
          ">>> DATA STREAM TERMINATED.",
          ">>> NOTE: SUPPRESSION FIELD MAY BE ACTIVE."
        ];
      }

      // Random minor log variation
      else if (Math.random() < 0.3) {
        mutated.logs = [
          `>>> ${mutated.id} UPDATE`,
          ">>> NOISE LEVELS INCREASING.",
          ">>> SIGNAL PATTERN: NON-STANDARD.",
          ">>> NOTE: FURTHER OBSERVATION REQUIRED."
        ];
      }

      return mutated;
    });
  }

  const liveNodes = mutateNodes(baseNodes);

  function appendLog(lines, glitch = false) {
    logPanel.textContent += lines.join("\n") + "\n\n";
    logPanel.scrollTop = logPanel.scrollHeight;
    if (glitch) {
      crtEl.classList.add("glitch");
      setTimeout(() => crtEl.classList.remove("glitch"), 150);
    }
  }

  function createNodeElement(node) {
    const nodeEl = document.createElement("div");
    nodeEl.className = "node";
    nodeEl.style.left = node.x + "%";
    nodeEl.style.top = node.y + "%";

    if (node.status === "offline") nodeEl.classList.add("offline");
    if (node.status === "hot") nodeEl.classList.add("hot");

    const labelEl = document.createElement("div");
    labelEl.className = "node-label";
    labelEl.textContent = node.id;
    labelEl.style.left = node.x + "%";
    labelEl.style.top = node.y + "%";

    nodeEl.addEventListener("click", () => {
      appendLog([
        `>>> QUERYING ${node.id}...`,
        `>>> STATUS: ${node.status.toUpperCase()}`,
        ""
      ], true);
      appendLog(node.logs);
    });

    mapContainer.appendChild(nodeEl);
    mapContainer.appendChild(labelEl);
  }

  function initMap() {
    appendLog([
      ">>> INCIDENT OVERLAY ONLINE.",
      ">>> NODES LOADED:",
      liveNodes.map(n => `>>> - ${n.id} [${n.status.toUpperCase()}]`).join("\n")
    ]);

    liveNodes.forEach(createNodeElement);

    // Optional: random ambient log
    if (Math.random() < 0.4) {
      appendLog([
        ">>> BACKGROUND PROCESS:",
        ">>> NEW ANOMALY FLAGGED IN UNMAPPED REGION.",
        ">>> NOTE: MAP DATA INCOMPLETE."
      ]);
    }
  }

  initMap();
</script>

</body>
</html>
