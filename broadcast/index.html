<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEKKID BROADCAST SYSTEM v0.7b</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .crt {
      width: 90%;
      max-width: 800px;
      background: #000;
      border: 1px solid #0f0;
      box-shadow: 0 0 20px #0f0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .crt::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(0, 255, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.2) 2%,
        rgba(0, 255, 0, 0.05) 4%
      );
      background-size: 100% 4px;
      mix-blend-mode: screen;
      opacity: 0.4;
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    #status-bar {
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .meter-label {
      display: inline-block;
      margin-right: 8px;
    }

    .meter {
      display: inline-block;
      font-family: monospace;
    }

    #input-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    #prompt {
      flex: 0 0 auto;
    }

    #command {
      flex: 1 1 auto;
      background: #000;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    #command:focus {
      outline: none;
      box-shadow: 0 0 8px #0f0;
    }

    #help {
      margin-top: 8px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .glitch {
      animation: glitch 0.15s linear 1;
    }

    @keyframes glitch {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 0); }
      50% { transform: translate(1px, 0); }
      75% { transform: translate(0, -1px); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <div class="crt" id="crt">
    <div id="status-bar">
      <span class="meter-label">ATTENTION LEVEL:</span>
      <span class="meter" id="attention-meter">[----------]</span>
    </div>
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt">&gt;&gt;&gt;</span>
      <input id="command" type="text" autocomplete="off" spellcheck="false" placeholder="Type 1, 2, 3 or a command and press Enter">
    </div>
    <div id="help">
      Valid inputs: numbers for choices (1, 2, 3...) or commands like <code>logs</code>, <code>status</code>, <code>abort</code>.
    </div>
  </div>

  <script>
    const outputEl = document.getElementById("output");
    const commandEl = document.getElementById("command");
    const attentionEl = document.getElementById("attention-meter");
    const crtEl = document.getElementById("crt");

    let attention = 0; // 0–10
    let state = "boot";
    let logsUnlocked = false;
    let frequenciesScanned = false;
    let softOverrideUsed = false;
    let hardOverrideUsed = false;
    let finalReady = false;
    let ended = false;

    function append(text, glitch = false) {
      outputEl.textContent += text + "\n";
      outputEl.scrollTop = outputEl.scrollHeight;
      if (glitch) {
        crtEl.classList.add("glitch");
        setTimeout(() => crtEl.classList.remove("glitch"), 150);
      }
    }

    function setAttention(delta) {
      attention = Math.max(0, Math.min(10, attention + delta));
      const filled = "#".repeat(attention);
      const empty = "-".repeat(10 - attention);
      attentionEl.textContent = `[${filled}${empty}]`;
      if (attention >= 8 && !ended) {
        append(">>> WARNING: THE GAZE IS SHIFTING TOWARD THIS CHANNEL.", true);
      }
      if (attention >= 10 && !ended) {
        endLockedOut();
      }
    }

    function bootSequence() {
      append(">>> INITIALIZING NEKKID BROADCAST SYSTEM...");
      append(">>> VERSION: 0.7b (UNAUTHORIZED BUILD)");
      append(">>> STATUS: SIGNAL WEAK");
      append(">>> SOURCE: UNKNOWN");
      append("");
      append("A dormant broadcast node flickers online. You are not supposed to be here.");
      append("Your objective is simple:");
      append("Hijack the signal. Broadcast your message. Avoid the gaze.");
      append("");
      showChoices([
        "Scan for open frequencies",
        "Attempt soft override",
        "Access system logs"
      ]);
      state = "hub";
    }

    function showChoices(choices) {
      choices.forEach((c, i) => {
        append(`[${i + 1}] ${c}`);
      });
      append("");
    }

    function handleHubChoice(choice) {
      switch (choice) {
        case "1":
          scanFrequencies();
          break;
        case "2":
          softOverride();
          break;
        case "3":
          accessLogs();
          break;
        default:
          append(">>> INVALID INPUT. USE 1, 2, OR 3.");
      }
    }

    function scanFrequencies() {
      frequenciesScanned = true;
      setAttention(1);
      append(">>> SCANNING FREQUENCIES...");
      append(">>> MULTIPLE CHANNELS DETECTED.");
      append(">>> MOST ARE QUIET. SOME ARE NOT.");
      append("");
      append("You detect suppressed activity on:");
      append("- LAYER 3: intermittent bursts, quickly damped.");
      append("- LAYER 7: continuous low-level hum, artificially flattened.");
      append("");
      append("Something is actively smoothing out the strangeness.");
      append("");
      showChoices([
        "Focus on LAYER 3 anomalies",
        "Probe LAYER 7 suppression field",
        "Return to main node"
      ]);
      state = "scan";
    }

    function handleScanChoice(choice) {
      switch (choice) {
        case "1":
          setAttention(1);
          append(">>> FOCUSING ON LAYER 3 ANOMALIES...");
          append("Short bursts of signal appear, then vanish as if erased mid-transmission.");
          append("You catch a fragment:");
          append("\"...they're not what they—\"");
          append("The rest is gone.");
          append("");
          showChoices([
            "Try to reconstruct the fragment",
            "Mark this channel for later injection",
            "Return to main node"
          ]);
          state = "scanL3";
          break;
        case "2":
          setAttention(2);
          append(">>> PROBING LAYER 7 SUPPRESSION FIELD...");
          append("The hum grows louder, then flattens again.");
          append("You feel watched, but no source is identified.");
          append("");
          append(">>> ANOMALY FLAGGED: SOMETHING IS WATCHING THE FREQUENCIES.");
          append("");
          showChoices([
            "Push deeper into the suppression field",
            "Back off and return to main node"
          ]);
          state = "scanL7";
          break;
        case "3":
          hubReturn();
          break;
        default:
          append(">>> INVALID INPUT.");
      }
    }

    function handleScanL3Choice(choice) {
      switch (choice) {
        case "1":
          setAttention(2);
          append(">>> ATTEMPTING FRAGMENT RECONSTRUCTION...");
          append("You rebuild a partial phrase:");
          append("\"THEY ARE NOT WHAT THEY CLAIM\"");
          append("The system tries to redact it, but you pin it in memory.");
          append("");
          logsUnlocked = true;
          hubReturn();
          break;
        case "2":
          append(">>> CHANNEL MARKED FOR LATER INJECTION.");
          append("If you gain control, this will be your broadcast path.");
          append("");
          hubReturn();
          break;
        case "3":
          hubReturn();
          break;
        default:
          append(">>> INVALID INPUT.");
      }
    }

    function handleScanL7Choice(choice) {
      switch (choice) {
        case "1":
          setAttention(3);
          append(">>> PUSHING DEEPER INTO SUPPRESSION FIELD...");
          append("The hum becomes a pressure. The system UI flickers.");
          append("");
          append(">>> ATTENTION LEVEL SPIKE DETECTED.");
          append(">>> SOMETHING HAS NOTICED YOUR PROBING.");
          append("");
          hubReturn();
          break;
        case "2":
          append(">>> BACKING OFF. SUPPRESSION FIELD REMAINS INTACT.");
          append("");
          hubReturn();
          break;
        default:
          append(">>> INVALID INPUT.");
      }
    }

    function softOverride() {
      softOverrideUsed = true;
      setAttention(2);
      append(">>> INITIATING SOFT OVERRIDE...");
      append("You attempt to slip a signal between existing noise without triggering alarms.");
      append("");
      append("The system resists, but does not fully reject you.");
      append("You gain partial access to a mid-tier broadcast layer.");
      append("");
      showChoices([
        "Stabilize the partial access",
        "Risk a hard override from here",
        "Return to main node"
      ]);
      state = "soft";
    }

    function handleSoftChoice(choice) {
      switch (choice) {
        case "1":
          append(">>> STABILIZING PARTIAL ACCESS...");
          append("Your foothold in the broadcast layer strengthens.");
          append("You are close to being able to inject a message.");
          append("");
          finalReady = true;
          hubReturn();
          break;
        case "2":
          hardOverride(true);
          break;
        case "3":
          hubReturn();
          break;
        default:
          append(">>> INVALID INPUT.");
      }
    }

    function hardOverride(fromSoft = false) {
      hardOverrideUsed = true;
      setAttention(fromSoft ? 3 : 4);
      append(">>> INITIATING HARD OVERRIDE...");
      append("You force a signal spike, pushing against whatever is flattening the network.");
      append("");
      append("The node shakes. The UI glitches. For a moment, everything goes silent.");
      append("");
      append(">>> YOU HAVE TEMPORARY CONTROL OF A BROADCAST CHANNEL.");
      append(">>> WHATEVER WATCHES THIS NETWORK IS NOW AWARE OF YOU.");
      append("");
      finalReady = true;
      hubReturn();
    }

    function accessLogs() {
      setAttention(1);
      append(">>> ACCESSING SYSTEM LOGS...");
      append("");
      append("[LOG 12] Unauthorized pings detected on port : 731");
      append("[LOG 13] Unknown user attempting to access Broadcast Layer 2");
      append("[LOG 21] Suppression field recalibrated after anomaly.");
      append("");
      if (logsUnlocked) {
        append("[LOG 44] They're watching the frequencies.");
        append("[LOG 45] If you're reading this, don't trust the system.");
        append("[LOG 46] The signal isn't broken. It's being held down.");
        append("[LOG 47] If you get this far... finish what I couldn't.");
        append("");
      } else {
        append("Additional logs appear redacted. You may need deeper access to reveal them.");
        append("");
      }
      hubReturn();
    }

    function hubReturn() {
      append("You are back at the main node.");
      append("");
      if (!finalReady) {
        showChoices([
          "Scan for open frequencies",
          "Attempt soft override",
          "Access system logs"
        ]);
        state = "hub";
      } else {
        showChoices([
          "Compose final transmission",
          "Review system logs",
          "Abort and disconnect"
        ]);
        state = "finalHub";
      }
    }

    function handleFinalHubChoice(choice) {
      switch (choice) {
        case "1":
          composeTransmission();
          break;
        case "2":
          accessLogs();
          break;
        case "3":
          endAbort();
          break;
        default:
          append(">>> INVALID INPUT.");
      }
    }

    function composeTransmission() {
      setAttention(2);
      append(">>> COMPOSING FINAL TRANSMISSION...");
      append(">>> WARNING: ATTENTION LEVEL CRITICAL.");
      append("");
      append("You have seconds before the gaze fully locks onto this channel.");
      append("Your payload must be both a warning and encoded enough to slip through.");
      append("");
      append("Choose the core of your message:");
      showChoices([
        "Warn them: \"They are not what they claim\"",
        "Warn them: \"The signal is being held down\"",
        "Warn them: \"You are being watched\""
      ]);
      state = "compose";
    }

    function handleComposeChoice(choice) {
      let payload;
      switch (choice) {
        case "1":
          payload = "THEY ARE NOT WHAT THEY CLAIM";
          break;
        case "2":
          payload = "THE SIGNAL IS BEING HELD DOWN";
          break;
        case "3":
          payload = "YOU ARE BEING WATCHED";
          break;
        default:
          append(">>> INVALID INPUT.");
          return;
      }
      encodedBroadcast(payload);
    }

    function encodedBroadcast(payload) {
      setAttention(3);
      append("");
      append(">>> ENCODING PAYLOAD USING LAYER-3 SUBSTITUTION...");
      const encoded = simpleEncode(payload);
      append(`>>> RAW: "${payload}"`);
      append(`>>> ENCODED: ${encoded}`);
      append("");
      append("Only those who know how to read the pattern will understand.");
      append("");
      append(">>> PRESS ENTER TO BROADCAST.");
      state = "readyToSend";
    }

    function simpleEncode(text) {
      // Very simple A1Z26-style encoding for vibe
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const chars = text.toUpperCase().split("");
      const codes = chars.map(ch => {
        if (alphabet.includes(ch)) {
          return alphabet.indexOf(ch) + 1;
        } else if (ch === " ") {
          return "/";
        } else {
          return ch;
        }
      });
      return codes.join("-");
    }

    function sendBroadcast() {
      setAttention(3);
      append("");
      append(">>> TRANSMISSION SENT.");
      append(">>> THE SIGNAL IS OUT THERE NOW.");
      append("");
      append("For a moment, the suppression field flickers.");
      append("Somewhere, someone sees a glitch in their feed and doesn't know why.");
      append("");
      append(">>> THE GAZE IS LOCKING ONTO YOUR CHANNEL.");
      append(">>> CONNECTION WILL BE TERMINATED.");
      append("");
      append("You don't know who received your message.");
      append("You only know this:");
      append("Someone did.");
      append("");
      endSuccess();
    }

    function endSuccess() {
      ended = true;
      append(">>> LINK SEVERED.");
      append(">>> NEKKID BROADCAST SYSTEM NODE OFFLINE.");
      append("");
      append("The terminal goes dark, but the feeling of being watched does not.");
      append("");
      append("END: SIGNAL ESCAPED.");
      commandEl.disabled = true;
      commandEl.blur();
    }

    function endLockedOut() {
      ended = true;
      append("");
      append(">>> ATTENTION LEVEL MAXIMUM.");
      append(">>> ANOMALY CONTAINMENT PROTOCOL ACTIVE.");
      append("");
      append("The node freezes. Your access collapses.");
      append("No alarms sound. No warnings appear.");
      append("Just silence.");
      append("");
      append("END: GAZE FIXED. SIGNAL LOST.");
      commandEl.disabled = true;
      commandEl.blur();
    }

    function endAbort() {
      ended = true;
      append("");
      append(">>> MANUAL ABORT REQUESTED.");
      append(">>> DISCONNECTING FROM BROADCAST LAYER...");
      append("");
      append("You leave without sending anything.");
      append("The suppression field hums on, unchanged.");
      append("");
      append("END: SILENCE MAINTAINED.");
      commandEl.disabled = true;
      commandEl.blur();
    }

    function handleCommand(raw) {
      if (ended) return;
      const cmd = raw.trim().toLowerCase();
      if (!cmd) return;

      append(`>>> ${raw}`);

      // Global commands
      if (cmd === "status") {
        append(">>> NODE STATUS: UNSTABLE, UNAUTHORIZED.");
        append(`>>> ATTENTION LEVEL: ${attention}/10`);
        append("");
        return;
      }

      if (cmd === "logs") {
        accessLogs();
        return;
      }

      if (cmd === "abort") {
        endAbort();
        return;
      }

      // State-specific handling
      switch (state) {
        case "boot":
          bootSequence();
          break;
        case "hub":
          handleHubChoice(cmd);
          break;
        case "scan":
          handleScanChoice(cmd);
          break;
        case "scanL3":
          handleScanL3Choice(cmd);
          break;
        case "scanL7":
          handleScanL7Choice(cmd);
          break;
        case "soft":
          handleSoftChoice(cmd);
          break;
        case "finalHub":
          handleFinalHubChoice(cmd);
          break;
        case "compose":
          handleComposeChoice(cmd);
          break;
        case "readyToSend":
          // Any input = send
          sendBroadcast();
          break;
        default:
          append(">>> UNRECOGNIZED STATE. SYSTEM GLITCHED.");
      }
    }

    commandEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const value = commandEl.value;
        commandEl.value = "";
        handleCommand(value);
      }
    });

    // Initial boot
    setAttention(0);
    bootSequence();
  </script>
</body>
</html>
