<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEKKID BROADCAST SYSTEM v0.7b</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .crt {
      width: 90%;
      max-width: 800px;
      background: #000;
      border: 1px solid #0f0;
      box-shadow: 0 0 20px #0f0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Scanlines */
    .crt::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(0, 255, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.2) 2%,
        rgba(0, 255, 0, 0.05) 4%
      );
      background-size: 100% 4px;
      mix-blend-mode: screen;
      opacity: 0.4;
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.4;
      min-height: 300px;
    }

    #status-bar {
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .meter-label {
      display: inline-block;
      margin-right: 8px;
    }

    .meter {
      display: inline-block;
      font-family: monospace;
    }

    #input-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    #prompt {
      flex: 0 0 auto;
    }

    #command {
      flex: 1 1 auto;
      background: #000;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    #command:focus {
      outline: none;
      box-shadow: 0 0 8px #0f0;
    }

    /* Blinking cursor */
    #cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background: #0f0;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Glitch effect */
    .glitch {
      animation: glitch 0.15s linear 1;
    }

    @keyframes glitch {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 0); }
      50% { transform: translate(1px, 0); }
      75% { transform: translate(0, -1px); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <div class="crt" id="crt">
    <div id="status-bar">
      <span class="meter-label">ATTENTION LEVEL:</span>
      <span class="meter" id="attention-meter">[----------]</span>
    </div>

    <div id="output"></div>

    <div id="input-line">
      <span id="prompt">&gt;&gt;&gt;</span>
      <input id="command" type="text" autocomplete="off" spellcheck="false">
      <div id="cursor"></div>
    </div>
  </div>

  <script>
    const outputEl = document.getElementById("output");
    const commandEl = document.getElementById("command");
    const cursorEl = document.getElementById("cursor");
    const attentionEl = document.getElementById("attention-meter");
    const crtEl = document.getElementById("crt");

    let attention = 0;
    let state = "boot";
    let logsUnlocked = false;
    let finalReady = false;
    let ended = false;

    /* Cursor follows typing */
    function updateCursor() {
      const width = commandEl.value.length * 9;
      cursorEl.style.transform = `translateX(${width}px)`;
    }
    commandEl.addEventListener("input", updateCursor);
    commandEl.addEventListener("keydown", updateCursor);
    commandEl.addEventListener("click", updateCursor);

    /* Clear screen */
    function clearScreen() {
      outputEl.textContent = "";
    }

    /* Append text */
    function append(text, glitch = false) {
      outputEl.textContent += text + "\n";
      if (glitch) {
        crtEl.classList.add("glitch");
        setTimeout(() => crtEl.classList.remove("glitch"), 150);
      }
    }

    /* Attention meter */
    function setAttention(delta) {
      attention = Math.max(0, Math.min(10, attention + delta));
      const filled = "#".repeat(attention);
      const empty = "-".repeat(10 - attention);
      attentionEl.textContent = `[${filled}${empty}]`;

      if (attention >= 8 && !ended) {
        append(">>> WARNING: THE GAZE IS SHIFTING TOWARD THIS CHANNEL.", true);
      }
      if (attention >= 10 && !ended) {
        endLockedOut();
      }
    }

    /* Boot sequence */
    function bootSequence() {
      clearScreen();
      append(">>> INITIALIZING NEKKID BROADCAST SYSTEM...");
      append(">>> VERSION: 0.7b (UNAUTHORIZED BUILD)");
      append(">>> STATUS: SIGNAL WEAK");
      append(">>> SOURCE: UNKNOWN\n");
      append("A dormant broadcast node flickers online. You are not supposed to be here.");
      append("Your objective is simple:");
      append("Hijack the signal. Broadcast your message. Avoid the gaze.\n");
      showChoices([
        "Scan for open frequencies",
        "Attempt soft override",
        "Access system logs"
      ]);
      state = "hub";
    }

    function showChoices(choices) {
      choices.forEach((c, i) => append(`[${i + 1}] ${c}`));
      append("");
    }

    /* HUB */
    function handleHubChoice(choice) {
      if (choice === "1") return scanFrequencies();
      if (choice === "2") return softOverride();
      if (choice === "3") return accessLogs();
      append(">>> INVALID INPUT.");
    }

    /* SCAN */
    function scanFrequencies() {
      clearScreen();
      setAttention(1);
      append(">>> SCANNING FREQUENCIES...");
      append(">>> MULTIPLE CHANNELS DETECTED.");
      append(">>> MOST ARE QUIET. SOME ARE NOT.\n");
      append("You detect suppressed activity on:");
      append("- LAYER 3: intermittent bursts, quickly damped.");
      append("- LAYER 7: continuous low-level hum, artificially flattened.\n");
      append("Something is actively smoothing out the strangeness.\n");
      showChoices([
        "Focus on LAYER 3 anomalies",
        "Probe LAYER 7 suppression field",
        "Return to main node"
      ]);
      state = "scan";
    }

    function handleScanChoice(choice) {
      if (choice === "1") return scanL3();
      if (choice === "2") return scanL7();
      if (choice === "3") return hubReturn();
      append(">>> INVALID INPUT.");
    }

    function scanL3() {
      clearScreen();
      setAttention(1);
      append(">>> FOCUSING ON LAYER 3 ANOMALIES...");
      append("Short bursts of signal appear, then vanish as if erased mid-transmission.");
      append("You catch a fragment:");
      append("\"...they're not what they—\"\n");
      showChoices([
        "Try to reconstruct the fragment",
        "Mark this channel for later injection",
        "Return to main node"
      ]);
      state = "scanL3";
    }

    function handleScanL3Choice(choice) {
      if (choice === "1") {
        clearScreen();
        setAttention(2);
        append(">>> ATTEMPTING FRAGMENT RECONSTRUCTION...");
        append("\"THEY ARE NOT WHAT THEY CLAIM\"");
        logsUnlocked = true;
        return hubReturn();
      }
      if (choice === "2") {
        clearScreen();
        append(">>> CHANNEL MARKED FOR LATER INJECTION.\n");
        return hubReturn();
      }
      if (choice === "3") return hubReturn();
      append(">>> INVALID INPUT.");
    }

    function scanL7() {
      clearScreen();
      setAttention(2);
      append(">>> PROBING LAYER 7 SUPPRESSION FIELD...");
      append("The hum grows louder, then flattens again.\n");
      append(">>> ANOMALY FLAGGED: SOMETHING IS WATCHING THE FREQUENCIES.\n");
      showChoices([
        "Push deeper into the suppression field",
        "Back off and return to main node"
      ]);
      state = "scanL7";
    }

    function handleScanL7Choice(choice) {
      if (choice === "1") {
        clearScreen();
        setAttention(3);
        append(">>> PUSHING DEEPER...");
        append("The UI flickers. Pressure builds.\n");
        return hubReturn();
      }
      if (choice === "2") return hubReturn();
      append(">>> INVALID INPUT.");
    }

    /* SOFT OVERRIDE */
    function softOverride() {
      clearScreen();
      setAttention(2);
      append(">>> INITIATING SOFT OVERRIDE...");
      append("You slip a signal between existing noise.\n");
      showChoices([
        "Stabilize the partial access",
        "Risk a hard override",
        "Return to main node"
      ]);
      state = "soft";
    }

    function handleSoftChoice(choice) {
      if (choice === "1") {
        clearScreen();
        append(">>> STABILIZING...");
        finalReady = true;
        return hubReturn();
      }
      if (choice === "2") return hardOverride();
      if (choice === "3") return hubReturn();
      append(">>> INVALID INPUT.");
    }

    /* HARD OVERRIDE */
    function hardOverride() {
      clearScreen();
      setAttention(4);
      append(">>> INITIATING HARD OVERRIDE...");
      append("The node shakes. The UI glitches.\n");
      append(">>> TEMPORARY CONTROL GAINED.");
      finalReady = true;
      hubReturn();
    }

    /* LOGS */
    function accessLogs() {
      clearScreen();
      setAttention(1);
      append(">>> ACCESSING SYSTEM LOGS...\n");
      append("[LOG 12] Unauthorized pings detected.");
      append("[LOG 13] Unknown user accessing Layer 2.");
      append("[LOG 21] Suppression field recalibrated.\n");
      if (logsUnlocked) {
        append("[LOG 44] They're watching the frequencies.");
        append("[LOG 45] Don't trust the system.");
        append("[LOG 46] The signal isn't broken. It's being held down.");
        append("[LOG 47] If you get this far... finish what I couldn't.\n");
      }
      hubReturn();
    }

    /* RETURN TO HUB */
    function hubReturn() {
      append("You are back at the main node.\n");
      if (!finalReady) {
        showChoices([
          "Scan for open frequencies",
          "Attempt soft override",
          "Access system logs"
        ]);
        state = "hub";
      } else {
        showChoices([
          "Compose final transmission",
          "Review system logs",
          "Abort and disconnect"
        ]);
        state = "finalHub";
      }
    }

    /* FINAL */
    function handleFinalHubChoice(choice) {
      if (choice === "1") return composeTransmission();
      if (choice === "2") return accessLogs();
      if (choice === "3") return endAbort();
      append(">>> INVALID INPUT.");
    }

    function composeTransmission() {
      clearScreen();
      setAttention(2);
      append(">>> COMPOSING FINAL TRANSMISSION...");
      append(">>> ATTENTION LEVEL CRITICAL.\n");
      append("Choose your warning:");
      showChoices([
        "They are not what they claim",
        "The signal is being held down",
        "You are being watched"
      ]);
      state = "compose";
    }

    function handleComposeChoice(choice) {
      let payload;
      if (choice === "1") payload = "THEY ARE NOT WHAT THEY CLAIM";
      else if (choice === "2") payload = "THE SIGNAL IS BEING HELD DOWN";
      else if (choice === "3") payload = "YOU ARE BEING WATCHED";
      else return append(">>> INVALID INPUT.");

      encodedBroadcast(payload);
    }

    function encodedBroadcast(payload) {
      clearScreen();
      setAttention(3);
      append(">>> ENCODING PAYLOAD...");
      const encoded = payload
        .toUpperCase()
        .split("")
        .map(ch => {
          const idx = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".indexOf(ch);
          return idx >= 0 ? idx + 1 : "/";
        })
        .join("-");
      append(`RAW: "${payload}"`);
      append(`ENCODED: ${encoded}\n`);
      append(">>> PRESS ENTER TO BROADCAST.");
      state = "readyToSend";
    }

    function sendBroadcast() {
      clearScreen();
      append(">>> TRANSMISSION SENT.");
      append(">>> THE SIGNAL IS OUT THERE NOW.\n");
      append("For a moment, the suppression field flickers.\n");
      append(">>> THE GAZE IS LOCKING ONTO YOUR CHANNEL.\n");
      endSuccess();
    }

    function endSuccess() {
      ended = true;
      append(">>> LINK SEVERED.");
      append(">>> END: SIGNAL ESCAPED.");
      commandEl.disabled = true;
    }

    function endLockedOut() {
      ended = true;
      clearScreen();
      append(">>> ATTENTION LEVEL MAXIMUM.");
      append(">>> END: GAZE FIXED. SIGNAL LOST.");
      commandEl.disabled = true;
    }

    function endAbort() {
      ended = true;
      clearScreen();
      append(">>> MANUAL ABORT.");
      append(">>> END: SILENCE MAINTAINED.");
      commandEl.disabled = true;
    }

    /* COMMAND HANDLER */
    function handleCommand(raw) {
      if (ended) return;
      const cmd = raw.trim();

      if (state === "boot") return bootSequence();
      if (state === "hub") return handleHubChoice(cmd);
      if (state === "scan") return handleScanChoice(cmd);
      if (state === "scanL3") return handleScanL3Choice(cmd);
      if (state === "scanL7") return handleScanL7Choice(cmd);
      if (state === "soft") return handleSoftChoice(cmd);
      if (state === "finalHub") return handleFinalHubChoice(cmd);
      if (state === "compose") return handleComposeChoice(cmd);
      if (state === "readyToSend") return sendBroadcast();
    }

    commandEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const value = commandEl.value;
        commandEl.value = "";
        updateCursor();
        handleCommand(value);
      }
    });

    /* Start */
    bootSequence();
  </script>
</body>
</html>
